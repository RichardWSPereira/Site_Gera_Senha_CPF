<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>
</head>

<body>
    <section class="container">
        <h1>Gerador de Senha</h1>
        <div class="senha-gerada">Selecione as opções</div>
        Quantidade de caracteres <input value='20' type="number" min="1" max="50" class="qtdSenha"><br>
        Adicionar maiúsculas <input type="checkbox" class="chk-maiusculas" checked><br>
        Adcionar minúsculas <input type="checkbox" class="chk-minusculas"><br>
        Adcionar números <input type="checkbox" class="chk-numeros"><br>
        Adcionar símbolos <input type="checkbox" class="chk-simbolos" checked><br>
        <button class="btn-gera">Gerar senha</button>
    </section>
    <script src="./assets/js/bundle.js"></script>
</body>

</html>
