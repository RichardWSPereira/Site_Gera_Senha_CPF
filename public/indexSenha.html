<section class="container">
    <h1>Gerador de Senha</h1>
    <div class="senha-gerada">Selecione as opções</div>
    <div class="style-div-options">
        <label>
            Quantidade de caracteres
            <input value="10" type="number" min="1" max="50" class="qtdSenha">
        </label><br>

        <label>
            Adicionar maiúsculas
            <input type="checkbox" class="chk-maiusculas" checked>
        </label><br>

        <label>
            Adicionar minúsculas
            <input type="checkbox" class="chk-minusculas">
        </label><br>

        <label>
            Adicionar números
            <input type="checkbox" class="chk-numeros">
        </label><br>

        <label>
            Adicionar símbolos
            <input type="checkbox" class="chk-simbolos" checked>
        </label><br>
    </div>
    <button type="button" class="btn-gera">Gerar senha</button>

</section>
